// letter(), common_length()는 main.cpp의 공통 함수
// 원곡은 배열 하나(data.all)에 이어 붙여 저장, 조각은 그 배열 안 시작 위치

struct Entry {
    int hash;  // 조각의 해시값
    int pos;   // 조각의 시작 위치 (원곡 전체 배열 기준)
};

class HashTable {
    // 길이 L 조각만 담은 해시표 하나
    struct Table {
        vector<int> offset;     // 칸 수 + 1개. offset[c] = c번 칸의 첫 항목 위치
        vector<Entry> entries;  // 조각 수만큼. 칸 순서대로 이어 붙인 항목
        // 역할: 이 해시표의 칸 수를 돌려준다. (offset은 칸 수보다 1개 많다)
        size_t buckets() const { return offset.size() - 1; }
    };

    // tables[L]: 길이 L 해시표 (L = 1~MAX_INPUT, 0번은 사용하지 않음)
    vector<Table> tables;

    // 멜로디 m의 s번 위치에서 시작하는 조각의 해시값을 길이 1~max_len까지 구한다.
    // 결과: hashes[L] = 길이 L 조각의 해시값
    static void piece_hashes(const Melody& m, int s, int max_len, long long hashes[]) {
        long long h = 0;
        for (int length = 1; length <= max_len; length++) {
            h = (h * 911382323 + letter(m, s, length - 1)) % 1000000007;  // 글자 하나를 뒤에 붙인다
            hashes[length] = h;
        }
    }

    // 길이 L로 입력과 일치하는 원곡 조각이 있는지 검사한다.
    // collect가 false: 일치를 하나 찾으면 바로 true를 돌려준다. (이진 탐색용)
    // collect가 true : 끝까지 확인하며 일치한 곡명을 names에 모두 모은다. (곡명 수집용)
    bool check(const Database& data, const Melody& query,
               const vector<vector<long long>>& query_hashes, int L,
               bool collect, set<string>& names) {
        int r = query.size();
        const Table& table = tables[L];

        for (int i = 0; i + L <= r; i++) {        // 입력의 길이 L 조각마다
            long long h = query_hashes[i][L];
            size_t c = h % table.buckets();       // 들어 있을 칸

            for (int e = table.offset[c]; e < table.offset[c + 1]; e++) {  // 그 칸의 항목을 처음부터 끝까지 본다
                const Entry& entry = table.entries[e];
                if (entry.hash != h) continue;    // 같은 칸이지만 해시값이 다름 → 다른 조각
                if (common_length(query, i, data.all, entry.pos, L) < L)
                    continue;                     // 해시값만 같고 내용이 다름 → 충돌, 버린다
                if (!collect) return true;        // 진짜 일치. 있다/없다만 볼 때는 여기서 끝
                names.insert(data.names[data.block_of(entry.pos)]);
            }
        }
        return !names.empty();
    }

public:
    // 역할: 검색 전에 한 번 하는 준비 작업.
    //       모든 블록의 모든 시작 위치에서 길이 1~32 조각을 만들어 길이별 해시표에 채워 넣는다.
    void build(const Database& data) {
        tables.assign(MAX_INPUT + 1, Table());

        // 1. 길이마다 조각 수를 세서 칸 수로 정한다.
        //    칸 수 = 조각 수 이면 칸 하나에 평균 1개 정도만 들어간다.
        //    블록 길이가 n이면 길이 L 조각은 n - L + 1개다. (n < L이면 0개)
        long long total = 0;  // 모든 길이의 조각 수 합 = 임시 해시값 배열 크기
        for (int L = 1; L <= MAX_INPUT; L++) {
            long long count = 0;
            for (int b = 0; b < data.blocks(); b++) {
                int n = data.end(b) - data.begin(b);
                if (n >= L) count += n - L + 1;
            }
            tables[L].offset.assign((count > 0 ? count : 1) + 1, 0);
            tables[L].entries.resize(count);
            total += count;
        }

        long long hashes[MAX_INPUT + 1];
        vector<int> saved;  // 1차에서 계산한 해시값을 계산한 순서대로 적어 둔다 (2차에서 다시 계산하지 않도록)
        saved.reserve(total);

        // 2. 1차로 훑는다. 해시값을 적어 두고, 칸마다 들어갈 조각 수를 offset[c + 1]에 센다.
        //    조각은 블록 안에 다 들어가야 한다. 블록 끝을 넘어 다음 블록으로 이어지지 않는다.
        for (int b = 0; b < data.blocks(); b++) {
            for (int s = data.begin(b); s < data.end(b); s++) {
                int max_len = min(MAX_INPUT, data.end(b) - s);
                piece_hashes(data.all, s, max_len, hashes);
                for (int L = 1; L <= max_len; L++) {
                    saved.push_back((int)hashes[L]);
                    Table& table = tables[L];
                    table.offset[hashes[L] % table.buckets() + 1]++;
                }
            }
        }

        // 3. 개수를 앞에서부터 더해서 칸마다 시작 위치로 바꾼다.
        //    예: 칸별 개수가 1, 3, 0, 0 이면 offset = 0, 1, 4, 4, 4
        for (int L = 1; L <= MAX_INPUT; L++) {
            vector<int>& offset = tables[L].offset;
            for (size_t c = 1; c < offset.size(); c++) offset[c] += offset[c - 1];
        }

        // 4. 2차로 훑는다. 적어 둔 해시값을 같은 순서로 읽어, 조각을 자기 칸의 다음 빈자리에 채운다.
        //    next[L][c]: 길이 L 해시표의 c번 칸에서 다음에 채울 위치
        vector<vector<int>> next(MAX_INPUT + 1);
        for (int L = 1; L <= MAX_INPUT; L++)
            next[L].assign(tables[L].offset.begin(), tables[L].offset.end() - 1);

        size_t k = 0;  // saved에서 다음에 읽을 위치
        for (int b = 0; b < data.blocks(); b++) {
            for (int s = data.begin(b); s < data.end(b); s++) {
                int max_len = min(MAX_INPUT, data.end(b) - s);
                for (int L = 1; L <= max_len; L++) {
                    int h = saved[k++];
                    Table& table = tables[L];
                    Entry& entry = table.entries[next[L][h % table.buckets()]++];
                    entry.hash = h;
                    entry.pos = s;
                }
            }
        }
    }

    // 역할: 입력과 같은 모양으로 이어지는 원곡 구간 중 가장 긴 것을 찾는다.
    //       (조옮김·길이 배율이 달라도 같은 모양이면 일치로 본다)
    //       돌려주는 값: 최대 일치 길이, 그 길이로 일치한 곡명 목록
    Result find(const Database& data, const Melody& query) {
        int r = query.size();

        // 1. 입력의 모든 조각 해시값을 구한다. query_hashes[i][L]: i번에서 시작하는 길이 L 조각
        vector<vector<long long>> query_hashes(r, vector<long long>(r + 1, 0));
        for (int i = 0; i < r; i++) piece_hashes(query, i, r - i, query_hashes[i].data());

        // 2. 최대 길이를 이진 탐색으로 찾는다.
        // 조기 종료: 입력 전체(길이 r)가 일치하면 이진 탐색 없이 바로 끝난다. 아니면 길이 1~r-1을 탐색한다.
        set<string> unused;  // 이진 탐색 중에는 곡명을 모으지 않는다
        int best = 0;
        if (check(data, query, query_hashes, r, false, unused)) {
            best = r;
        } else {
            int low = 1, high = r - 1;
            while (low <= high) {
                int mid = (low + high) / 2;
                if (check(data, query, query_hashes, mid, false, unused)) {
                    best = mid;       // 길이 mid 일치 있음 → 더 긴 길이를 검사한다
                    low = mid + 1;
                } else {
                    high = mid - 1;   // 없음 → 더 짧은 길이를 검사한다
                }
            }
        }

        // 3. 최대 길이 best로 일치하는 곡명을 모두 모은다.
        set<string> names;
        if (best > 0) check(data, query, query_hashes, best, true, names);
        return make_result(best, names);
    }
};
</script>
<script type="text/plain" id="src-py">
# letter(), common_length()는 main.py의 공통 함수
# 원곡은 배열 하나(data.all)에 이어 붙여 저장, 조각은 그 배열 안 시작 위치
from array import array

MOD = 1000000007
BASE = 911382323
MAX_INPUT = 32

class HashTable:

    def __init__(self):
        # 길이별 해시 테이블. 칸마다 리스트를 두지 않고 배열 세 개에 모아 저장 (C++와 같은 구조)
        #   offset[L][c]: 길이 L 표에서 c번 칸 항목의 시작 위치 (칸 수 + 1개)
        #   ent_hash[L], ent_pos[L]: 항목의 해시값과 시작 위치를 칸 순서대로 이어 붙인 배열
        # array("i")는 숫자를 4바이트씩 붙여 저장해 리스트·튜플보다 메모리가 훨씬 적음
        self.offset = []
        self.ent_hash = []
        self.ent_pos = []

    # 1. 멜로디 조각의 해시값 계산
    def piece_hashes(self, m, s, max_len):

        hashes = [0] * (max_len + 1)
        h = 0

        for length in range(1, max_len + 1):

            h = (
                h * BASE + letter(m, s, length - 1)
            ) % MOD

            hashes[length] = h

        return hashes

    # 2. 길이 L로 일치하는 조각이 있는지 확인
    def check(self, data, query, query_hashes,
              L, collect, names):

        r = query.size()
        offset = self.offset[L]
        ent_hash = self.ent_hash[L]
        ent_pos = self.ent_pos[L]
        buckets = len(offset) - 1

        # 입력의 모든 길이 L 조각 확인
        for i in range(r - L + 1):

            h = query_hashes[i][L]

            # 해시값으로 칸 찾기
            c = h % buckets

            # 같은 칸에 저장된 조각들 확인
            for e in range(offset[c], offset[c + 1]):

                # 해시값이 다르면 건너뛰기
                if ent_hash[e] != h:
                    continue

                pos = ent_pos[e]

                # 변화 글자가 실제로 같은지 확인
                length = common_length(
                    query, i, data.all, pos, L
                )

                if length < L:
                    continue

                # 일치 여부만 확인할 때
                if not collect:
                    return True

                # 일치한 곡명 저장
                names.add(data.names[data.block_of(pos)])

        return len(names) > 0

    # 3. 해시 테이블 구축
    def build(self, data):

        self.offset = [None] * (MAX_INPUT + 1)
        self.ent_hash = [None] * (MAX_INPUT + 1)
        self.ent_pos = [None] * (MAX_INPUT + 1)
        total = 0

        # 길이별로 칸 수 = 조각 수
        for L in range(1, MAX_INPUT + 1):

            count = 0

            for b in range(data.blocks()):

                n = data.end(b) - data.begin(b)

                if n >= L:
                    count += n - L + 1

            # 조각이 없어도 최소 1칸 생성
            self.offset[L] = array("i", [0]) * (max(count, 1) + 1)
            self.ent_hash[L] = array("i", [0]) * count
            self.ent_pos[L] = array("i", [0]) * count
            total += count

        # 1차: 해시값을 계산해 saved에 적어 두고 칸마다 들어갈 조각 수 세기
        saved = array("i", [0]) * total
        k = 0

        for b in range(data.blocks()):

            end = data.end(b)

            for s in range(data.begin(b), end):

                max_len = min(MAX_INPUT, end - s)

                hashes = self.piece_hashes(
                    data.all, s, max_len
                )

                for L in range(1, max_len + 1):

                    h = hashes[L]
                    saved[k] = h
                    k += 1

                    offset = self.offset[L]
                    offset[h % (len(offset) - 1) + 1] += 1

        # 개수를 앞에서부터 더해 칸마다 시작 위치로 바꾸기
        for L in range(1, MAX_INPUT + 1):

            offset = self.offset[L]

            for c in range(1, len(offset)):
                offset[c] += offset[c - 1]

        # 2차: 적어 둔 해시값을 같은 순서로 읽어 칸마다 다음 빈자리에 채우기
        # (해시값을 다시 계산하지 않음)
        nxt = [None] + [self.offset[L][:-1] for L in range(1, MAX_INPUT + 1)]
        k = 0

        for b in range(data.blocks()):

            end = data.end(b)

            for s in range(data.begin(b), end):

                max_len = min(MAX_INPUT, end - s)

                for L in range(1, max_len + 1):

                    h = saved[k]
                    k += 1

                    cur = nxt[L]
                    c = h % len(cur)
                    e = cur[c]
                    cur[c] = e + 1

                    self.ent_hash[L][e] = h
                    self.ent_pos[L][e] = s

    # 4. 가장 긴 일치 구간 검색
    def find(self, data, query):

        r = query.size()

        # 입력 조각들의 해시값 계산
        query_hashes = []

        for i in range(r):

            hashes = self.piece_hashes(
                query, i, r - i
            )

            query_hashes.append(hashes)

        # 이진 탐색으로 최대 일치 길이 찾기
        unused = set()

        low = 1
        high = r
        best = 0

        # 조기 종료: 입력 전체가 일치하면 이진 탐색 없이 끝
        if self.check(
            data, query, query_hashes,
            r, False, unused
        ):
            best = r
            low = r + 1

        else:
            high = r - 1

        while low <= high:

            mid = (low + high) // 2

            if self.check(
                data, query, query_hashes,
                mid, False, unused
            ):
                best = mid
                low = mid + 1

            else:
                high = mid - 1

        # 최대 길이로 일치한 곡명 수집
        names = set()

        if best > 0:
            self.check(
                data, query, query_hashes,
                best, True, names
            )

        return best, sorted(names)
</script>

<script>
{
const M = buildModel(), { songs, query: Q, L } = M, A = songs[0];
const W = 680, X = PX + LBL, BX = PX + 60, GAP = 46, LEN = 4, r = Q.notes.length;
const fmt = h => h.toLocaleString('en-US');

// 길이 4 해시표. 칸 수 = 길이 4 조각 수 (C++ build와 같다)
const pcs = songs.flatMap(m => m.notes.map((_, s) => ({ m, s, id: 'ch-' + m.tag + s })).filter(p => plen(p.m, p.s) >= LEN));
const NB = pcs.length;
pcs.forEach(p => { p.h = hashOf(p.m, p.s, LEN); p.b = Number(p.h % BigInt(NB)); });
const cnt = Array(NB).fill(0); pcs.forEach(p => cnt[p.b]++);
const off = [0]; cnt.forEach((c, b) => off.push(off[b] + c));
const fill = off.slice(0, NB); pcs.forEach(p => { p.e = fill[p.b]++; p.d = p.e - off[p.b]; });
const qHash = i => { const h = hashOf(Q, i, LEN); return { h, b: Number(h % BigInt(NB)) }; };

// 그림 조각
const bx = b => BX + b * GAP;
const boxes = (id, y, o = {}) => ({ id, x: BX, y, html: `<div class="bk ${o.en ? 'en' : ''}">${Array.from({ length: NB }, (_, b) =>
  `<span class="${o.on && o.on(b) ? 'on' : ''}"><em>${b}</em>${o.num ? o.num(b) : ''}</span>`).join('')}</div>` });
const chipItem = (p, x, y, o = {}) => ({ id: p.id, x, y, html: chip(pname(p.m, p.s), 'w ' + (o.on ? 'on' : '')), o: o.o ?? 1, z: 3, from: o.from });
const lines = (y1, y2, on) => {
  const h = y2 - y1, mid = h / 2, path = [];
  for (let b = 0; b < NB; b++) if (cnt[b]) {
    const a = b * GAP + 20, c = off[b] * GAP + 20;
    path.push(`<path class="${on === b ? 'on' : ''}" d="M${a} 0C${a} ${mid} ${c} ${mid} ${c} ${h}"/>`);
  }
  return { id: 'lines', x: BX, y: y1, z: 1, html: `<svg class="ln" width="${NB * GAP}" height="${h}">${path.join('')}</svg>` };
};
const note = (id, x, y, t) => ({ id, x, y, html: `<span class="note">${esc(t)}</span>` });
const big = (id, x, y, t) => ({ id, x, y, html: `<span class="big">${esc(t)}</span>` });

// 조각 → 숫자 → 칸 (구축은 위치 0 조각, 검색은 입력 조각)
function toBucket(m, s, rowHTML, rowLab, showRem) {
  const h = hashOf(m, s, LEN), b = Number(h % BigInt(NB));
  const px = X + s * CW - 48, end = px + 48 + LEN * CW - 4;
  const it = [
    { id: rowLab.id, x: PX, y: PY, html: rowLab.html },
    { id: rowHTML.id, x: X, y: PY, html: rowHTML.html },
    { id: 'piece', x: px, y: PY + 56, html: pieceHTML(m, s, { len: LEN }) },
    { id: 'arw', x: end + 16, y: PY + 52, html: '<span class="arrow">→</span>' },
    big('hash', end + 58, PY + 52, fmt(h))
  ];
  if (showRem) it.push({ id: 'rem', x: end + 58, y: PY + 112, html: `<div style="display:flex;align-items:center;gap:12px"><span class="note">${NB}로 나눈 나머지</span><span class="big">${b}</span></div>` });
  return { it, b, px };
}

// 1. 해시값
const hashA = rem => () => {
  const { it, b, px } = toBucket(A, 0, { id: 'tl-A', html: tilesHTML(A, 0, 7, { range: [0, LEN] }) }, { id: 'lab-A', html: labHTML(A) }, rem);
  if (rem) {
    it.push(boxes('bk', PY + 200, { on: k => k === b }));
    it.push(chipItem(pcs[0], bx(b) + 2, PY + 248, { from: { x: px, y: PY + 58 } }));
  }
  return { W, H: rem ? PY + 296 : PY + 110, items: it };
};

// 2. 표에 넣기: 칸 아래로 줄줄이 이어 붙인다
const BY = PY + 40;
const chained = hl => () => {
  const it = [boxes('bk', BY, { on: b => hl && cnt[b] > 1 })];
  pcs.forEach(p => it.push(chipItem(p, bx(p.b) + 2, BY + 48 + p.d * 32)));
  for (let b = 0; b < NB; b++) if (cnt[b]) it.push({ id: 'link' + b, x: bx(b) + 19, y: BY + 40, w: 2, h: 8 + (cnt[b] - 1) * 32 + 14, z: 1, html: '<div class="link"></div>' });
  return { W, H: BY + 48 + Math.max(...cnt) * 32 + 12, items: it };
};

// 3. 한 줄 저장 (offset + entries)
// 칸 배열은 칸 수 + 1개: 칸마다 자기 항목의 시작 위치, 마지막(끝)은 전체 항목 수. 빈 칸은 다음 칸과 같은 숫자
const bkRow = (y, hl) => ({ id: 'bk', x: BX, y, html: `<div class="bk">${Array.from({ length: NB + 1 }, (_, b) => {
  const cls = [b === NB ? 'end' : '', b === hl ? 'on' : '', hl != null && b === hl + 1 ? 'nx' : '', b < NB && !cnt[b] ? 'zero' : ''].join(' ');
  return `<span class="${cls}"><em>${b === NB ? '끝' : b}</em>${off[b]}</span>`;
}).join('')}</div>` });
const flat = (bkY, enY, o = {}) => [
  note('lb-bk', PX, bkY + 8, '칸'),
  note('lb-en', PX, enY + 8, '항목'),
  o.full ? bkRow(bkY, o.hl) : boxes('bk', bkY, { num: b => cnt[b] ? off[b] : '', on: b => b === o.hl }),
  boxes('en', enY, { en: true, on: e => o.seg != null && e >= off[o.seg] && e < off[o.seg + 1] }),
  lines(bkY + 40, enY - 28, o.hl),
  ...pcs.map(p => chipItem(p, bx(p.e) + 2, enY + 6, { on: o.ok && o.ok(p), o: o.drop && o.drop(p) ? .3 : 1 }))
];
const SW = Math.max(W, BX + (NB + 1) * GAP + PX);
const store = b => () => {
  const it = flat(BY, BY + 130, { hl: b, seg: b, full: true });
  if (b != null) it.push({ id: 'rng', x: bx(off[b]), y: BY + 130 + 62, html: `<span class="pill blue">${b}번 칸 → 항목 ${off[b]}~${off[b + 1] - 1}번</span>` });
  return { W: SW, H: BY + 130 + (b != null ? 112 : 56), items: it };
};

// 4. 길이별 표
const lenRows = () => {
  const counts = Array.from({ length: 7 }, (_, k) => songs.reduce((t, m) => t + Math.max(0, m.notes.length - k), 0));
  const total = counts.reduce((a, b) => a + b, 0);
  return { W, H: PY + 7 * 40 + 70, items: [
    ...counts.map((c, k) => ({ id: 'lr' + k, x: PX, y: PY + k * 40, html: `<div class="lenrow"><span class="k">길이 ${k + 1}</span><span class="sq ${k + 1 === LEN ? 'on' : ''}">${'<b></b>'.repeat(c)}</span><span class="n">${c}개</span></div>` })),
    { id: 'tot', x: PX, y: PY + 7 * 40 + 16, html: `<span class="pill">조각 ${counts[0]}개 → 저장 항목 ${total}개</span>` }
  ] };
};

// 5. 칸 찾기 (검색)
const SY = PY + 200, EY = SY + 130;
const find = (i, step) => () => {
  const { it, b } = toBucket(Q, i, { id: 'tl-Q', html: tilesHTML(Q, 0, r, { range: [i, i + LEN] }) }, { id: 'lab-Q', html: labHTML(Q) }, true);
  const h = qHash(i).h;
  it.push(...flat(SY, EY, step ? { hl: b, seg: b, ok: p => p.b === b && p.h === h, drop: p => p.b === b && p.h !== h } : { hl: b }));
  return { W, H: EY + 56, items: it, focus: SY };
};

// 6. 길이 좁히기 (C++ find 2단계: low = 1, high = 입력 길이)
const has = len => Q.notes.some((_, i) => i + len <= r && songs.some(m => m.notes.some((_, j) => common(Q, i, m, j) >= len)));
const narrow = [];
{
  let lo = 1, hi = r; const done = {};
  narrow.push({ lo, hi, done: { ...done } });
  while (lo <= hi) {
    const mid = (lo + hi) >> 1, ok = has(mid);
    for (const k in done) if (done[k] === 'ok') done[k] = 'old';
    done[mid] = ok ? 'ok' : 'no';
    if (ok) lo = mid + 1; else hi = mid - 1;
    narrow.push({ lo, hi, done: { ...done }, mid, ok });
  }
}
const NLW = r * 48 + (r - 1) * 6;
const line = t => () => ({ W, H: PY + 48 + 30, items: [{ id: 'nl', x: (W - NLW) / 2, y: PY + 10, html: `<div class="nl">${Array.from({ length: r }, (_, k) => {
  const v = k + 1, d = t.done[v];
  const cls = d || (v < t.lo || v > t.hi ? 'out' : 'in');
  return `<span class="${cls}">${v}</span>`;
}).join('')}</div>` }] });
const lineTitle = (t, last) => {
  if (!t.mid) return '';
  if (!t.ok) return last ? `${t.mid}칸 일치 없음, 가장 긴 길이는 ${L}칸` : `${t.mid}칸 일치 없음, 더 짧은 길이 확인`;
  return last ? `${t.mid}칸 일치 있음, 가장 긴 길이는 ${L}칸` : `${t.mid}칸 일치 있음, 더 긴 길이 확인`;
};

const QI = M.best[0].i;
const other = pcs.find(p => cnt[p.b] > 2 && pcs.some(o => o.b === p.b && o.h !== p.h));
const QO = other ? Q.notes.findIndex((_, i) => i + LEN <= r && qHash(i).b === other.b) : -1;
// 그림 아래 설명에 쓰는 값
const tags = list => '위치 ' + list.map(p => pname(p.m, p.s)).join(', ');
const b0 = pcs[0].b, qb = qHash(QI).b, ob = QO >= 0 ? qHash(QO).b : -1;
const okAt = (b, h) => tags(pcs.filter(p => p.b === b && p.h === h)), dropAt = (b, h) => tags(pcs.filter(p => p.b === b && p.h !== h));
const lineDesc = t => {
  if (!t.mid) return ['범위의 가운데 길이 선택', '그 길이의 표에 입력과 일치하는 조각이 있는지 확인', '있으면 더 긴 쪽, 없으면 더 짧은 쪽 절반만 남김', '범위가 빌 때까지 반복'];
  if (t.lo > t.hi) return `더 확인할 길이가 없어 탐색 종료. 확인한 길이 중 일치가 있는 가장 긴 길이 ${L}칸이 정답.`;
  return `${t.mid}칸 일치가 ${t.ok ? '있으므로 더 긴' : '없으므로 더 짧은'} ${t.lo}~${t.hi}칸만 다음 확인 대상.`;
};

startPage({
  W,
  next: { href: 'results.html', label: '다음: 결과와 비교' },
  steps: [
    changeStep(M),
    { phase: '구축', label: '해시값', title: `길이 ${LEN}인 조각 하나를 숫자 하나로 변환([[다항식 롤링 해시]])`, frames: [
      { desc: ['계산식: h = (h × 911,382,323 + 번호) ÷ 1,000,000,007의 나머지, 조각의 번호를 앞에서부터 하나씩 붙임', '911,382,323을 곱하는 이유: 앞 번호를 자릿값처럼 밀어 올려 순서가 다르면 다른 숫자', '1,000,000,007로 나누는 이유: 숫자가 계속 커지지 않게 10억 미만으로 유지, 소수라 값이 고르게 퍼짐', '같은 조각은 항상 같은 숫자'], draw: hashA(false) },
      { title: `숫자를 조각 수 ${NB}로 나눈 나머지 = 칸 번호`, desc: `칸 수는 길이 ${LEN} 조각 수와 같은 ${NB}개. 나머지가 ${b0}이므로 위치 0 조각은 ${b0}번 칸에 저장.`, draw: hashA(true) }
    ] },
    { phase: '구축', label: '길이별 표', title: '조각 길이마다 해시표를 따로 하나씩 생성', desc: ['입력과 몇 칸이 일치할지 미리 알 수 없어 길이마다 표를 따로 생성 (예제는 길이 1~7, 실제 코드는 1~32)', '표마다 버킷 수 = 그 길이로 만든 조각 수 (오른쪽 숫자), 버킷 하나에 평균 1개씩 들어가도록', '같은 시작 위치가 길이별로 여러 번 저장돼 정렬 배열보다 메모리를 더 사용', `다음 단계부터 길이 ${LEN} 표(파란 줄)에 조각을 넣는 과정`], frames: [{ draw: lenRows }] },
    { phase: '구축', label: '표에 넣기', title: `길이 ${LEN}인 조각 ${NB}개를 각자 칸에 넣기`, frames: [
      { desc: `길이 ${LEN} 조각을 모두 같은 방법으로 칸에 배치. 빈 칸도 있고 여러 개가 모인 칸도 있음.`, draw: chained(false) },
      { title: '한 칸에 여러 조각이 모이면 줄줄이 연결 (체이닝)', desc: 'A와 C처럼 같은 모양의 조각은 반드시 같은 칸. 모양이 다른 조각이 같은 칸에 모이는 [[해시 충돌]]도 발생.', draw: chained(true) }
    ] },
    { phase: '구축', label: '한 줄 저장', title: '칸 순서대로 배열 한 줄에 이어 저장', frames: [
      { desc: ['칸마다 따로 목록을 두지 않고, 항목을 칸 번호 순서로 배열 하나에 이어 붙임', '항목 하나 = 해시값 + 조각 시작 위치 (각 4바이트, 합 8바이트), 그림의 숫자는 시작 위치', '칸에는 자기 항목이 항목 배열 몇 번부터 시작하는지 기록, 빈 칸은 다음 칸과 같은 숫자', `맨 끝 칸(끝)은 전체 항목 수 ${NB}`, '메모리를 덜 쓰고 연속해서 읽기 쉬운 구조'], draw: store(undefined) },
      { title: '칸 번호로 그 칸의 항목 범위 찾기', desc: [`${b0}번 칸의 숫자 ${off[b0]}: 항목이 시작하는 위치`, `다음 칸(${b0 + 1}번)의 숫자 ${off[b0 + 1]}: 여기서 끝 (${off[b0 + 1]}번은 포함하지 않음)`, `그래서 항목 배열 ${off[b0]}~${off[b0 + 1] - 1}번 (${tags(pcs.filter(p => p.b === b0))} 조각)만 확인`], draw: store(pcs[0].b) }
    ] },
    { phase: '검색', label: '칸 찾기', title: '입력 조각도 같은 방법으로 칸 번호 계산', frames: [
      { desc: [`입력 조각 Q${QI}의 해시값 계산`, `조각 수 ${NB}로 나눈 나머지로 칸 번호 ${qb} 결정`, '원곡과 같은 모양이면 같은 숫자라 같은 칸'], draw: find(QI, false) },
      { title: '그 칸의 항목만 꺼내 변화 기호를 하나씩 비교해 확인', desc: `${qb}번 칸의 항목만 확인하고 다른 칸은 보지 않음. 해시값과 변화 기호가 모두 같은 ${okAt(qb, qHash(QI).h)} 확인.`, draw: find(QI, true) },
      ...(QO >= 0 ? [{ title: '[[해시 충돌]]이 난 칸에서는 해시값이 같은 항목만 선택', desc: [`입력 조각 Q${QO}의 칸 번호 ${ob} 계산`, `${ob}번 칸에는 [[해시 충돌]]로 다른 조각 ${dropAt(ob, qHash(QO).h)}도 함께 저장`, '저장해 둔 해시값이 다른 항목은 바로 제외(흐린 칸)', '해시값이 같은 항목만 변화 기호를 하나씩 비교'], draw: find(QO, true) }] : [])
    ] },
    { phase: '검색', label: '길이 좁히기', title: `길이 1~${r} 범위를 절반씩 줄여 가장 긴 일치 길이 탐색`, frames:
      narrow.map((t, k) => ({ title: lineTitle(t, k === narrow.length - 1) || undefined, desc: lineDesc(t), draw: line(t) })) },
    resultStep(M),
    bigOStep('[[O(1) 평균 상수 시간]]: 검색 식에 원곡 크기 N이 없음', [
      { label: '구축', factors: [['N', '시작 위치'], ['32', '길이 1~32 해시'], ['2', '두 번 훑기']], ops: ['×', '×'], result: 'O(N)' },
      { label: '검색', factors: [['r²', '입력 조각 해시 계산'], ['log r', '길이 이진 탐색'], ['r', '입력 조각'], ['1', '칸 평균 항목']], ops: ['+', '×', '×'], result: 'O(r²)' }
    ], ['N = 원곡 전체 음 개수(조각 수), r = 입력 음 개수(최대 32)', '구축: 시작 위치마다 길이 1~32 해시를 한 번에 계산, 1차에서 해시값을 적어 두고 칸 크기를 센 뒤 2차에서 그 값으로 배치, 항목이 최대 32 × N개라 메모리도 그만큼 사용', '칸 수 = 조각 수라 한 칸에 평균 항목 1개 (적재율 1)', '검색: 길이를 이진 탐색하며 입력 조각마다 칸 하나만 확인, 식에 N이 없어 원곡이 늘어도 시간 거의 일정', '한 칸에 항목이 몰리는 최악의 경우 O(N)까지 가능해서 [[평균]] 상수 시간']),
    codeStep('03_hash_table.cpp'),
    codeStep('03_hash_table.py', 'py')
  ]
});
}
