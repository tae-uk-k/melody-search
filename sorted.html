<script type="text/plain" id="src">
// letter(), common_length(), piece_less()는 main.cpp의 공통 함수
// s번에서 시작하는 조각의 k번째 변화 기호
int letter(const Melody& m, int s, int k) {
    if (k == 0) return m.patch[s] == -1 ? START_NOTE : START_REST;  // 첫 칸은 시작 표시
    int p = s + k;
    if (p == m.patch[s]) return m.edge_no_pitch[p];  // 쉼으로 시작한 조각의 예외
    return m.edge[p];
}

// 두 조각의 앞부분이 몇 칸 같은지
int common_length(const Melody& a, int sa, const Melody& b, int sb, int limit) {
    int len_a = min(a.size() - sa, limit);
    int len_b = min(b.size() - sb, limit);
    int k = 0;
    while (k < len_a && k < len_b && letter(a, sa, k) == letter(b, sb, k)) k++;
    return k;
}

// 사전 순으로 a가 b보다 앞이면 true
bool piece_less(const Melody& a, int sa, const Melody& b, int sb, int limit) {
    int len_a = min(a.size() - sa, limit);
    int len_b = min(b.size() - sb, limit);
    int k = common_length(a, sa, b, sb, limit);
    if (k == len_a || k == len_b) return len_a < len_b;  // 한쪽이 끝나면 짧은 쪽이 앞
    return letter(a, sa, k) < letter(b, sb, k);  // 처음 다른 기호로 결정
}

// 조각 = (블록 번호, 시작 위치)
struct Piece {
    int block;
    int start;
};

class SortedArray {
    vector<Piece> pieces;  // 사전 순으로 정렬된 원곡 조각

    // 입력 i번 조각과 배열 k번 조각의 공통 길이
    int common_with(const vector<Melody>& blocks, const Melody& query, int i, int k) {
        const Piece& piece = pieces[k];
        return common_length(query, i, blocks[piece.block], piece.start, MAX_INPUT);
    }

public:
    void build(const vector<Melody>& blocks) {
        // 1. 모든 시작 위치를 조각으로 등록
        pieces.clear();
        for (int b = 0; b < (int)blocks.size(); b++) {
            for (int s = 0; s < blocks[b].size(); s++) {
                Piece piece;
                piece.block = b;
                piece.start = s;
                pieces.push_back(piece);
            }
        }

        // 2. 조각을 사전 순으로 정렬
        sort(pieces.begin(), pieces.end(), [&](const Piece& x, const Piece& y) {
            return piece_less(blocks[x.block], x.start, blocks[y.block], y.start, MAX_INPUT);
        });
    }

    Result find(const vector<Melody>& blocks, const Melody& query) {
        int r = query.size();
        int n = (int)pieces.size();

        // 1. 입력 조각마다 들어갈 자리를 이진 탐색
        vector<int> pos(r);
        for (int i = 0; i < r; i++) {
            int low = 0, high = n;
            while (low < high) {
                int mid = (low + high) / 2;
                const Piece& piece = pieces[mid];
                if (piece_less(blocks[piece.block], piece.start, query, i, MAX_INPUT))
                    low = mid + 1;  // 가운데 조각이 앞 → 아래쪽 절반
                else
                    high = mid;  // 아니면 → 위쪽 절반
            }
            pos[i] = low;
        }

        // 2. 바로 위·아래 조각과 비교해 최대 길이
        int best = 0;
        for (int i = 0; i < r; i++) {
            if (pos[i] - 1 >= 0) best = max(best, common_with(blocks, query, i, pos[i] - 1));
            if (pos[i] < n) best = max(best, common_with(blocks, query, i, pos[i]));
        }

        // 3. best 이상 같은 동안 위·아래로 넓혀 곡 수집
        set<string> names;
        if (best > 0) {
            for (int i = 0; i < r; i++) {
                for (int k = pos[i] - 1; k >= 0 && common_with(blocks, query, i, k) >= best; k--)
                    names.insert(blocks[pieces[k].block].name);
                for (int k = pos[i]; k < n && common_with(blocks, query, i, k) >= best; k++)
                    names.insert(blocks[pieces[k].block].name);
            }
        }
        return make_result(best, names);
    }
};

<script type="text/plain" id="src-py">
# letter(), common_length(), piece_less()는 main.py의 공통 함수
# s번에서 시작하는 조각의 k번째 변화 글자
def letter(m, s, k):
    if k == 0:  # 첫 칸은 시작 표시
        return START_NOTE if m.patch[s] == -1 else START_REST
    p = s + k
    if p == m.patch[s]:  # 쉼으로 시작한 조각의 예외
        return m.edge_no_pitch[p]
    return m.edge[p]

# 두 위치부터 변화 글자가 몇 칸 연속 같은지
def common_length(a, sa, b, sb, limit):
    len_a = min(a.size() - sa, limit)
    len_b = min(b.size() - sb, limit)
    k = 0
    while k < len_a and k < len_b and letter(a, sa, k) == letter(b, sb, k):
        k += 1
    return k

# 사전 순으로 a가 b보다 앞이면 True
def piece_less(a, sa, b, sb, limit):
    len_a = min(a.size() - sa, limit)
    len_b = min(b.size() - sb, limit)
    k = common_length(a, sa, b, sb, limit)
    if k == len_a or k == len_b:  # 한쪽이 끝나면 짧은 쪽이 앞
        return len_a < len_b
    return letter(a, sa, k) < letter(b, sb, k)  # 처음 다른 글자로 결정

# 2. 세 알고리즘 파일 연결
# 3. 데이터 읽기, 입력, 실행 및 시간 측정
import time
import runpy
from pathlib import Path

# 세 알고리즘 파일에 main.py의 공통 함수를 전달한다.
folder = Path(__file__).resolve().parent
LinearArray = runpy.run_path(str(folder / "01_linear_array.py"), init_globals=globals())["LinearArray"]
SortedArray = runpy.run_path(str(folder / "02_sorted_array.py"), init_globals=globals())["SortedArray"]
HashTable = runpy.run_path(str(folder / "03_hash_table.py"), init_globals=globals())["HashTable"]

from functools import cmp_to_key

MAX_INPUT = 32

class SortedArray:

    def __init__(self):
        # (블록 번호, 시작 위치)를 저장할 배열
        self.pieces = []

    # 입력 조각과 원곡 조각의 공통 길이 계산
    def common_with(self, blocks, query, i, k):

        b, s = self.pieces[k]

        return common_length(
            query, i, blocks[b], s, MAX_INPUT
        )

    # 1. 정렬 배열 구축
    def build(self, blocks):

        self.pieces = []

        # 모든 블록의 모든 시작 위치 저장
        for b in range(len(blocks)):
            for s in range(blocks[b].size()):
                self.pieces.append((b, s))

        # 조각의 변화 글자열을 기준으로 비교
        def compare(x, y):

            b1, s1 = x
            b2, s2 = y

            if piece_less(
                blocks[b1], s1,
                blocks[b2], s2, MAX_INPUT
            ):
                return -1

            if piece_less(
                blocks[b2], s2,
                blocks[b1], s1, MAX_INPUT
            ):
                return 1

            return 0

        # 시작 위치가 아닌 변화 글자열 순서로 정렬
        self.pieces.sort(key=cmp_to_key(compare))

    # 2. 정렬 배열에서 멜로디 검색
    def find(self, blocks, query):

        r = query.size()
        n = len(self.pieces)

        # 입력 조각마다 들어갈 위치 저장
        pos = [0] * r

        # ① 이진 탐색
        for i in range(r):

            low = 0
            high = n

            while low < high:

                mid = (low + high) // 2
                b, s = self.pieces[mid]

                if piece_less(
                    blocks[b], s, query, i, MAX_INPUT
                ):
                    low = mid + 1
                else:
                    high = mid

            pos[i] = low

        # ② 바로 위와 아래 조각을 비교
        best = 0

        for i in range(r):

            if pos[i] - 1 >= 0:
                length = self.common_with(
                    blocks, query, i, pos[i] - 1
                )
                best = max(best, length)

            if pos[i] < n:
                length = self.common_with(
                    blocks, query, i, pos[i]
                )
                best = max(best, length)

        # ③ 최대 길이로 일치한 곡명 모으기
        names = set()

        if best > 0:

            for i in range(r):

                # 입력 위치의 왼쪽 탐색
                k = pos[i] - 1

                while k >= 0:

                    if self.common_with(
                        blocks, query, i, k
                    ) < best:
                        break

                    b, s = self.pieces[k]
                    names.add(blocks[b].name)

                    k -= 1

                # 입력 위치의 오른쪽 탐색
                k = pos[i]

                while k < n:

                    if self.common_with(
                        blocks, query, i, k
                    ) < best:
                        break

                    b, s = self.pieces[k]
                    names.add(blocks[b].name)

                    k += 1

        return best, sorted(names)

<script>
{
const M = buildModel(), { songs, query: Q, L } = M, A = songs[0];
const W = 760, X = PX + LBL, LX = PX + 16, QX = 400, r = Q.notes.length;
const rowY = i => PY + i * RH;
const all = songs.flatMap(m => m.notes.map((_, s) => ({ m, s, id: 'pc-' + m.tag + s })));
const order = [...all].sort((a, b) => less(a.m, a.s, b.m, b.s) ? -1 : less(b.m, b.s, a.m, a.s) ? 1 : 0);
const n = order.length, com = (p, i) => common(p.m, p.s, Q, i), qid = i => 'pc-Q' + i;

// C++ find 1단계와 같은 이진 탐색. pos = 입력 조각보다 앞에 오는 원곡 조각 수
function search(i) {
  let lo = 0, hi = n; const log = [];
  while (lo < hi) {
    const mid = (lo + hi) >> 1, p = order[mid], lt = less(p.m, p.s, Q, i);
    log.push({ lo, hi, mid, k: com(p, i), lt });
    if (lt) lo = mid + 1; else hi = mid;
  }
  return { pos: lo, log };
}
const pos = Q.notes.map((_, i) => search(i).pos);
const bestOf = i => Math.max(pos[i] > 0 ? com(order[pos[i] - 1], i) : 0, pos[i] < n ? com(order[pos[i]], i) : 0);
const QI = M.best[0].i, S = search(QI), P = S.pos;

// 배열 그림. ins: 입력 조각을 끼워 넣을 자리, row: 칸마다 강조 방법
const list = (o = {}) => order.map((p, idx) => {
  const st = o.row ? o.row(p, idx) : {};
  return { id: p.id, x: LX, y: rowY(o.ins != null && idx >= o.ins ? idx + 1 : idx), html: pieceHTML(p.m, p.s, st), o: st.o ?? 1 };
});
const pill = (id, x, y, t, cls = '') => ({ id, x, y: y - 2, html: `<span class="pill ${cls}">${esc(t)}</span>` });
const qRow = (extra = []) => [
  { id: 'lab-Q', x: PX, y: PY, html: labHTML(Q) },
  { id: 'tl-Q', x: X, y: PY, html: tilesHTML(Q, 0, r) },
  ...extra
];
const stair = (i, o = {}) => ({ id: qid(i), x: X + i * CW - 48, y: PY + 52 + i * RH, from: { x: X + i * CW - 48, y: PY }, html: pieceHTML(Q, i, o) });

// 1. 조각: 곡 A만 잘라 보이고, 다음 화면에서 21개를 한 배열로
const cut = () => ({ W, H: PY + 52 + 7 * RH + 10, items: [
  { id: 'lab-A', x: PX, y: PY, html: labHTML(A) },
  { id: 'tl-A', x: X, y: PY, html: tilesHTML(A, 0, 7) },
  ...A.notes.map((_, s) => ({ id: 'pc-A' + s, x: X + s * CW - 48, y: PY + 52 + s * RH, from: { x: X + s * CW - 48, y: PY }, html: pieceHTML(A, s) }))
] });
const gather = () => ({ W, H: rowY(n) + 10, items: all.map((p, idx) => ({ id: p.id, x: LX, y: rowY(idx), html: pieceHTML(p.m, p.s) })) });

// 2. 정렬. 둘째 화면은 앞부분이 2칸 이상 같은 이웃을 칠한다
const near = idx => Math.max(idx > 0 ? common(order[idx - 1].m, order[idx - 1].s, order[idx].m, order[idx].s) : 0,
  idx < n - 1 ? common(order[idx + 1].m, order[idx + 1].s, order[idx].m, order[idx].s) : 0);

// 3. 입력 조각
const qIntro = () => ({ W, H: PY + 100, items: [
  { id: 'lab-Q', x: PX, y: PY, html: labHTML(Q) },
  { id: 'ct-Q', x: X, y: PY - 6, html: contourHTML(Q) },
  { id: 'tl-Q', x: X, y: PY + 46, html: tilesHTML(Q, 0, r) }
] });
const qCut = () => ({ W, H: PY + 52 + r * RH + 10, items: qRow(Q.notes.map((_, i) => stair(i))) });

// 4. 자리 찾기: 비교 한 번 = 화면 한 장
const say = (t, k) => {
  const p = order[t.mid];
  if (t.k === plen(p.m, p.s) && t.k === plen(Q, QI)) return `${k}번째 비교: 끝까지 같음, 위쪽 절반 계속 탐색`;
  return t.lt ? `${k}번째 비교: 입력 조각이 더 뒤, 아래쪽 절반만 남김` : `${k}번째 비교: 입력 조각이 더 앞, 위쪽 절반만 남김`;
};
const range = (lo, hi) => ({ id: 'brk', x: LX - 22, y: rowY(lo), w: 4, h: (hi - lo) * RH - 6, html: '<div class="brk" style="height:100%"></div>' });
const ready = () => ({ W, H: rowY(n) + 10, focus: rowY(0), items: [
  ...list(), range(0, n),
  { id: qid(QI), x: QX, y: rowY(0), html: pieceHTML(Q, QI) }
] });
const compare = t => () => {
  const p = order[t.mid], miss = t.k < Math.min(plen(p.m, p.s), plen(Q, QI)) ? t.k : -1;
  const qw = 48 + plen(Q, QI) * CW - 4;
  return { W, H: rowY(n) + 10, focus: rowY(t.mid), items: [
    ...list({ row: (_, idx) => idx === t.mid ? { on: t.k, miss } : { o: idx >= t.lo && idx < t.hi ? 1 : .25 } }),
    { id: 'band', x: LX - 10, y: rowY(t.mid) - 3, w: QX + qw + 10 - (LX - 10), h: RH, z: 1, html: '<div class="band" style="height:100%"></div>' },
    range(t.lo, t.hi),
    { id: qid(QI), x: QX, y: rowY(t.mid), html: pieceHTML(Q, QI, { on: t.k, miss }) }
  ] };
};
const found = () => ({ W, H: rowY(n + 1) + 10, focus: rowY(P), items: [
  ...list({ ins: P }),
  { id: qid(QI), x: LX, y: rowY(P), html: pieceHTML(Q, QI) }
] });

// 5. 이웃 비교
const ku = com(order[P - 1], QI), kd = com(order[P], QI);
// 비교 한 번의 이유 (그림 아래 설명)
const why = t => {
  const p = order[t.mid], lp = plen(p.m, p.s), lq = plen(Q, QI), q = `Q${QI} 조각`;
  const tail = t.lo > 0 || t.hi < n ? ' 흐린 조각은 이미 제외된 범위.' : '';
  if (t.k === lp && t.k === lq) return '두 조각이 끝까지 같음. 같은 조각이 여러 개면 맨 위 자리를 찾아야 하므로 위쪽 계속 탐색.' + tail;
  if (t.k === lp) return `가운데 조각이 ${q}의 앞부분과 같고 더 짧음. 짧은 쪽이 앞이라 ${q}은 아래쪽.` + tail;
  if (t.k === lq) return `${q}이 가운데 조각의 앞부분과 같고 더 짧음. 짧은 쪽이 앞이라 ${q}은 위쪽.` + tail;
  return `파란 칸까지 같고 테두리 칸에서 번호가 다름. ${t.lt ? '가운데 조각' : q}의 번호가 더 작아 ${q}은 ${t.lt ? '아래쪽' : '위쪽'}.` + tail;
};
const neighbors = () => ({ W, H: rowY(n + 1) + 10, focus: rowY(P), items: [
  ...list({ ins: P, row: (_, idx) => idx === P - 1 ? { tint: ku } : idx === P ? { tint: kd } : { o: .25 } }),
  { id: qid(QI), x: LX, y: rowY(P), html: pieceHTML(Q, QI, { tint: Math.max(ku, kd) }) },
  pill('pu', QX, rowY(P - 1), `${ku}칸`, ku >= kd ? 'blue' : 'soft'),
  pill('pd', QX, rowY(P + 1), `${kd}칸`, kd >= ku ? 'blue' : 'soft')
] });
const every = () => ({ W, H: PY + 52 + r * RH + 10, items: qRow(Q.notes.flatMap((_, i) => {
  const b = bestOf(i), top = i === QI;
  return [stair(i, top ? { on: b } : { tint: b }), pill('pb' + i, X + r * CW + 16, PY + 52 + i * RH, `${b}칸`, top ? 'blue' : 'soft')];
})) });

// 6. 곡 모으기: 공통 길이가 L 이상인 동안 위아래로 넓힌다
const hit = new Set();
let upStop = -1, dnStop = -1;
for (let k = P - 1; k >= 0; k--) { if (com(order[k], QI) >= L) hit.add(k); else { upStop = k; break; } }
for (let k = P; k < n; k++) { if (com(order[k], QI) >= L) hit.add(k); else { dnStop = k; break; } }
const collect = () => ({ W, H: rowY(n + 1) + 10, focus: rowY(P), items: [
  ...list({ ins: P, row: (p, idx) => {
    if (hit.has(idx)) return { on: L };
    if (idx === upStop || idx === dnStop) { const k = com(p, QI); return { tint: k, miss: k < plen(p.m, p.s) ? k : -1 }; }
    return { o: .25 };
  } }),
  { id: qid(QI), x: LX, y: rowY(P), html: pieceHTML(Q, QI, { on: L }) },
  ...[...hit].map(idx => pill('nm' + idx, QX, rowY(idx >= P ? idx + 1 : idx), order[idx].m.name, 'blue'))
] });

startPage({
  W,
  next: { href: 'hash.html', label: '다음 방식: 체이닝 해시' },
