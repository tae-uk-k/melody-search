<script type="text/plain" id="src">
// raw_match_length()는 main.cpp의 공통 함수
// 입력 i번, 곡 j번부터 몇 칸 연속으로 같은 멜로디인지 센다
int raw_match_length(const Melody& q, int i, const Melody& m, int j, int limit) {
    // 첫 칸 쌍의 길이 비율 (약분한 정수 두 개)
    long long g = gcd_ll(q.notes[i].length, m.notes[j].length);
    long long ratio_q = q.notes[i].length / g;
    long long ratio_m = m.notes[j].length / g;

    bool has_shift = false;  // 높이 차이를 아직 정하지 않음
    int shift = 0;

    int k = 0;
    while (k < limit && i + k < (int)q.notes.size() && j + k < (int)m.notes.size()) {
        const Note& a = q.notes[i + k];
        const Note& b = m.notes[j + k];

        if ((a.pitch == -1) != (b.pitch == -1)) break;  // 음·쉼 종류가 다름

        long long gg = gcd_ll(a.length, b.length);
        if (a.length / gg != ratio_q || b.length / gg != ratio_m) break;  // 길이 비율이 다름

        if (a.pitch != -1) {
            if (!has_shift) {
                shift = b.pitch - a.pitch;  // 첫 음 쌍에서 높이 차이 결정
                has_shift = true;
            } else if (b.pitch - a.pitch != shift) {  // 높이 차이가 다름
                break;
            }
        }
        k++;
    }
    return k;
}

class LinearArray {
public:
    void build(const vector<Melody>&) {}  // 미리 할 일 없음

    Result find(const vector<Melody>& blocks, const Melody& query) {
        int r = (int)query.notes.size();
        int best = 0;
        set<string> names;

        for (const Melody& block : blocks) {
            int block_best = 0;
            // 입력 시작 위치 × 곡 시작 위치, 모든 쌍 비교
            for (int i = 0; i < r; i++) {
                for (int j = 0; j < (int)block.notes.size(); j++) {
                    int length = raw_match_length(query, i, block, j, r);
                    if (length > block_best) block_best = length;
                }
            }

            if (block_best > best) {  // 더 긴 일치 → 곡 목록 새로 시작
                best = block_best;
                names.clear();
            }
            if (block_best == best && best > 0) names.insert(block.name);  // 같은 길이 → 곡 추가
        }
        return make_result(best, names);
    }
};
</script>
<script src="common.js?v=4"></script>
<script>
{
const M = buildModel(), { songs, query: Q } = M, A = songs[0], r = Q.notes.length;
const X = PX + LBL, qY = PY + 3 * 60 + 24;

// 1. 구축: 할 일이 없음. 곡과 입력을 받은 그대로 둔다
const plain = () => {
  const it = [];
  songs.forEach((m, k) => {
    it.push({ id: 'lab-' + m.tag, x: PX, y: PY + k * 60 + 6, html: labHTML(m) });
    it.push({ id: 'ct-' + m.tag, x: X, y: PY + k * 60, html: contourHTML(m) });
  });
  it.push({ id: 'lab-Q', x: PX, y: qY + 6, html: labHTML(Q) });
  it.push({ id: 'ct-Q', x: X, y: qY, html: contourHTML(Q) });
  return { W: 700, H: qY + 52, items: it };
};

// 2. 한 쌍 비교: 입력 i번 칸을 곡 j번 칸 아래에 맞대고 한 칸씩 비교
const pair = (i, j, show) => {
  const k = rawMatch(Q, i, A, j), over = Math.min(plen(Q, i), plen(A, j));
  const inA = c => c >= j && c < j + over, inQ = c => c >= i && c < i + over;
  const it = [
    { id: 'lab-A', x: PX, y: PY + 6, html: labHTML(A) },
    { id: 'ct-A', x: X, y: PY, html: contourHTML(A, { on: c => show && c >= j && c < j + k, miss: show && k < over ? j + k : -1, dim: c => !inA(c) }) },
    { id: 'lab-Q', x: PX, y: PY + 72, html: labHTML(Q) },
    { id: 'ct-Q', x: X + (j - i) * 36, y: PY + 66, html: contourHTML(Q, { on: c => show && c >= i && c < i + k, miss: show && k < over ? i + k : -1, dim: c => !inQ(c) }) }
  ];
  if (show) it.push({ id: 'pill', x: X + 8 * 36 + 24, y: PY + 38, html: `<span class="pill ${k === over ? 'blue' : ''}">${k}칸 일치</span>` });
  return { W: 700, H: PY + 66 + 60, items: it };
};

// 3. 모든 쌍: 입력 시작 칸 r개 × 곡 시작 칸 전부
const total = songs.reduce((t, m) => t + m.notes.length, 0);
const cols = `36px ${songs.map(m => `repeat(${m.notes.length},24px)`).join(' 8px ')}`;
let mx = `<b class="rl"></b>` + songs.map((m, g) => `<b class="hd" style="grid-column:span ${m.notes.length}">${chip(m.tag)}</b>` + (g < songs.length - 1 ? '<b class="sp"></b>' : '')).join('');
Q.notes.forEach((_, i) => {
  mx += `<b class="rl">Q${i}</b>`;
  let col = 0;
  songs.forEach((m, g) => {
    m.notes.forEach((_, j) => {
      const k = rawMatch(Q, i, m, j), v = k > 1 ? `color-mix(in srgb,var(--blue) ${20 + 80 * (k - 1) / (M.L - 1)}%,var(--card))` : 'var(--fill)';
      mx += `<b style="--v:${v};--d:${(col++) * 22 + i * 6}ms">${k === M.L ? k : ''}</b>`;
    });
    if (g < songs.length - 1) mx += '<b class="sp"></b>';
  });
});
const matrix = fill => ({
  W: 700, H: PY + 60 + (r + 1) * 28 + 10,
  items: [
    { id: 'cnt', x: PX, y: PY, html: `<span class="pill ${fill ? 'blue' : ''}">입력 시작 ${r}곳 × 곡 시작 ${total}곳 = ${r * total}번</span>` },
    { id: 'mx', x: PX, y: PY + 56, html: `<div class="mx" style="grid-template-columns:${cols}">${mx}</div>`, cls: fill ? 'fill' : '' }
  ]
});

startPage({
  W: 700,
  next: { href: 'sorted.html', label: '다음 방식: 정렬 배열' },
  steps: [
    { phase: '구축', label: '그대로 저장', title: '곡을 받은 그대로 저장, 미리 할 작업 없음', desc: '순차 배열은 미리 정리하지 않음. 검색할 때마다 저장된 곡 전체를 처음부터 끝까지 확인.', frames: [{ draw: plain }] },
    { phase: '검색', label: '한 번 비교', title: '입력을 곡 아래에 겹쳐 놓고 앞에서부터 한 칸씩 비교', frames: [
      { title: '입력 첫 음을 곡 첫 음 아래에 맞춤', desc: '입력(Q)을 곡(A) 아래에 놓고 같은 세로줄끼리 비교. 흐린 칸은 서로 겹치지 않아 비교하지 않는 칸.', draw: () => pair(0, 0, false) },
      { title: '두 번째 칸에서 모양이 달라져 1칸만 일치', desc: ['첫 칸 쌍으로 높이 차이와 길이 비율 결정', '다음 칸도 같은 차이와 비율인지 확인', '테두리 칸에서 달라져 비교 중단'], draw: () => pair(0, 0, true) },
      { title: '입력 두 번째 음부터 맞추면 7칸 모두 일치', desc: '입력을 한 칸 옮기면 높이 차이 +7, 길이 비율 ×2가 끝까지 유지. 곡 전체와 일치.', draw: () => pair(1, 0, true) }
    ] },
    { phase: '검색', label: '완전 탐색', title: `[[완전 탐색]]: 시작 위치 쌍 ${r * total}개를 모두 비교`, frames: [
      { desc: ['왼쪽 Q0~Q7은 입력의 시작 위치, A·B·C 아래 네모는 각 곡의 시작 위치', '네모 하나마다 앞 단계의 비교를 한 번 실행', '건너뛰는 경우 없이 모든 쌍 확인'], draw: () => matrix(false) },
      { title: '네모 하나가 비교 한 번의 결과, 진할수록 길게 일치', desc: '숫자 7이 가장 긴 일치. 곡이 늘어나면 이 표의 세로줄도 그만큼 늘어나 비교 횟수가 데이터에 비례.', draw: () => matrix(true) }
    ] },
    resultStep(M),
    costStep('linear', '[[O(N) 선형 시간]]: 곡 수가 10배면 검색 시간도 10배', 'ms', '데이터 항목 수를 1만, 10만, 100만으로 늘리며 C++로 잰 입력 1개의 검색 시간. 모든 위치를 비교하므로 데이터에 비례해 증가.'),
    codeStep('01_linear_array.cpp')
  ]
});
}
