<script type="text/plain" id="src">
// raw_match_length()는 main.cpp의 공통 함수
// 입력 i번, 곡 j번부터 몇 칸 연속으로 같은 멜로디인지 센다
int raw_match_length(const Melody& q, int i, const Melody& m, int j, int limit) {
    // 첫 칸 쌍의 길이 비율 (약분한 정수 두 개)
    long long g = gcd_ll(q.notes[i].length, m.notes[j].length);
    long long ratio_q = q.notes[i].length / g;
    long long ratio_m = m.notes[j].length / g;

    bool has_shift = false;  // 높이 차이를 아직 정하지 않음
    int shift = 0;

    int k = 0;
    while (k < limit && i + k < (int)q.notes.size() && j + k < (int)m.notes.size()) {
        const Note& a = q.notes[i + k];
        const Note& b = m.notes[j + k];

        if ((a.pitch == -1) != (b.pitch == -1)) break;  // 음·쉼 종류가 다름

        long long gg = gcd_ll(a.length, b.length);
        if (a.length / gg != ratio_q || b.length / gg != ratio_m) break;  // 길이 비율이 다름

        if (a.pitch != -1) {
            if (!has_shift) {
                shift = b.pitch - a.pitch;  // 첫 음 쌍에서 높이 차이 결정
                has_shift = true;
            } else if (b.pitch - a.pitch != shift) {  // 높이 차이가 다름
                break;
            }
        }
        k++;
    }
    return k;
}

class LinearArray {
public:
    void build(const vector<Melody>&) {}  // 미리 할 일 없음

    Result find(const vector<Melody>& blocks, const Melody& query) {
        int r = (int)query.notes.size();
        int best = 0;
        set<string> names;

        for (const Melody& block : blocks) {
            int block_best = 0;
            // 입력 시작 위치 × 곡 시작 위치, 모든 쌍 비교
            for (int i = 0; i < r; i++) {
                for (int j = 0; j < (int)block.notes.size(); j++) {
                    int length = raw_match_length(query, i, block, j, r);
                    if (length > block_best) block_best = length;
                }
            }

            if (block_best > best) {  // 더 긴 일치 → 곡 목록 새로 시작
                best = block_best;
                names.clear();
            }
            if (block_best == best && best > 0) names.insert(block.name);  // 같은 길이 → 곡 추가
        }
        return make_result(best, names);
    }
};
</script>
<script type="text/plain" id="src-py">
# raw_match_length()는 main.py의 공통 함수
# 입력 i번, 곡 j번부터 몇 칸 연속으로 같은 멜로디인지 센다
def raw_match_length(q, i, m, j, limit):
    # 첫 칸 쌍의 길이 비율 (약분한 정수 두 개)
    g = gcd_ll(q.notes[i][1], m.notes[j][1])
    ratio_q = q.notes[i][1] // g
    ratio_m = m.notes[j][1] // g
    has_shift = False  # 높이 차이를 아직 정하지 않음
    shift = 0
    k = 0
    while k < limit and i + k < len(q.notes) and j + k < len(m.notes):
        a_pitch, a_length = q.notes[i + k]
        b_pitch, b_length = m.notes[j + k]
        if (a_pitch == -1) != (b_pitch == -1):  # 음·쉼 종류가 다름
            break
        gg = gcd_ll(a_length, b_length)
        if a_length // gg != ratio_q or b_length // gg != ratio_m:  # 길이 비율이 다름
            break
        if a_pitch != -1:
            if not has_shift:
                shift = b_pitch - a_pitch  # 첫 음 쌍에서 높이 차이 결정
                has_shift = True
            elif b_pitch - a_pitch != shift:  # 높이 차이가 다름
                break
        k += 1
    return k

class LinearArray:

    # 순차 배열은 별도의 색인을 만들지 않음
    def build(self, blocks):
        pass

    # 입력 멜로디와 원곡을 비교하여 가장 긴 일치 구간 찾기
    def find(self, blocks, query):

        r = len(query.notes)

        best = 0          # 전체 최대 일치 길이
        names = set()     # 최대 길이로 일치한 곡명

        # 원곡의 모든 블록을 하나씩 확인
        for block in blocks:

            block_best = 0  # 현재 블록의 최대 일치 길이

            # 입력 멜로디의 모든 시작 위치
            for i in range(r):

                # 원곡 멜로디의 모든 시작 위치
                for j in range(len(block.notes)):

                    # 두 위치부터 연속으로 일치하는 길이 계산
                    length = raw_match_length(
                        query, i, block, j, r
                    )

                    # 현재 블록에서 가장 긴 길이 저장
                    if length > block_best:
                        block_best = length

            # 전체 최대 길이보다 길면 갱신
            if block_best > best:
                best = block_best
                names.clear()

            # 최대 길이가 같으면 곡명 추가
            if block_best == best and best > 0:
                names.add(block.name)

        # 최대 일치 길이와 정렬된 곡명 반환
        return best, sorted(names)
</script>
<script src="common.js?v=9"></script>
<script>
{
// 순차 배열 예제: 블록 길이 16, 9, 8칸, 입력 5칸 (입력 첫 칸은 틀린 음)
const mk = (tag, name, arr, q) => ({ tag, name, q, notes: arr.map(([p, d]) => ({ p, d })) });
const blocks = [
  mk('A', '반짝반짝 작은 별', [[60, 2], [60, 2], [67, 2], [67, 2], [69, 2], [69, 2], [67, 4], [65, 2], [65, 2], [64, 2], [64, 2], [62, 2], [62, 2], [60, 4], [67, 2], [67, 2]]),
  mk('B', '떴다 떴다 비행기', [[64, 3], [62, 1], [60, 2], [62, 2], [64, 2], [64, 2], [64, 4], [62, 2], [62, 2]]),
  mk('C', 'ABC 노래', [[65, 2], [65, 2], [72, 2], [72, 2], [74, 2], [74, 2], [72, 4], [70, 2]])
];
const Q = mk('Q', '입력 구절', [[55, 2], [62, 4], [62, 4], [64, 4], [64, 4]], true), r = Q.notes.length;
const A = blocks[0], X = PX + LBL, NMAX = Math.max(...blocks.map(m => m.notes.length)), total = blocks.reduce((t, m) => t + m.notes.length, 0);
// 모든 쌍의 일치 길이 (코드와 같은 순서: 블록 → 입력 시작 i → 블록 시작 j)
const K = blocks.map(m => Q.notes.map((_, i) => m.notes.map((_, j) => rawMatch(Q, i, m, j))));
const L = Math.max(...K.flat(2));
const best = [];
blocks.forEach((m, b) => K[b].forEach((row, i) => row.forEach((k, j) => { if (k === L) best.push({ m, i, j }); })));
const names = [...new Set(best.map(x => x.m.name))];

// 배열 칸: 칸 안 숫자 = 배열 번호
const cells = (from, to, cls) => { let h = ''; for (let c = from; c < to; c++) h += `<span class="tl ${cls(c) || ''}">${c}</span>`; return `<div class="row">${h}</div>`; };
const lenTag = m => `<span class="note">${m.notes.length}칸</span>`;

// 1. 구축: 받은 그대로 배열로 저장
const plain = () => {
  const it = [], y = k => k < 3 ? PY + k * 56 : PY + 3 * 56 + 24;
  [...blocks, Q].forEach((m, k) => {
    it.push({ id: 'lab-' + m.tag, x: PX, y: y(k), html: labHTML(m) });
    it.push({ id: 'arr-' + m.tag, x: X, y: y(k), html: cells(0, m.notes.length, () => '') });
    it.push({ id: 'len-' + m.tag, x: X + m.notes.length * CW + 12, y: y(k) + 5, html: lenTag(m) });
  });
  return { W: X + NMAX * CW + 70, H: y(3) + 52, items: it };
};

// 2. 한 쌍 비교: 입력 i번 칸을 블록 j번 칸 아래에 맞대고 같은 세로줄끼리 비교
const pair = (i, j) => {
  const k = K[0][i][j], over = Math.min(r - i, A.notes.length - j), y0 = PY + 28, y1 = y0 + 64;
  const miss = k < over;
  return { W: X + A.notes.length * CW + 150, H: y1 + 66, items: [
    { id: 'lab-A', x: PX, y: y0, html: labHTML(A) },
    { id: 'arr-A', x: X, y: y0, html: cells(0, A.notes.length, c => c >= j && c < j + k ? 'on' : miss && c === j + k ? 'miss' : c < j || c >= j + over ? 'dim' : '') },
    { id: 'jm', x: X + j * CW, y: y0 - 26, w: 32, html: `<span class="cap mk">j=${j}</span>` },
    { id: 'lab-Q', x: PX, y: y1, html: labHTML(Q) },
    { id: 'arr-Q', x: X + (j - i) * CW, y: y1, html: cells(0, r, c => c < i ? 'dim' : c < i + k ? 'on' : miss && c === i + k ? 'miss' : c >= i + over ? 'dim' : '') },
    { id: 'im', x: X + j * CW, y: y1 + 38, w: 32, html: `<span class="cap mk">i=${i}</span>` },
    { id: 'pill', x: X + A.notes.length * CW + 20, y: y0 + 30, html: `<span class="pill ${k === over ? 'blue' : ''}">${k}칸 일치</span>` }
  ] };
};

// 3. 반복 순서: 입력 한 줄이 원곡 아래에서 한 칸씩 뒤로 이동. 원곡 끝에 닿으면 처음부터 다시
// 위치마다 입력 첫 칸부터 비교 → 맞은 칸 수 기록 → 맞든 틀리든 한 칸 뒤로
const SX = PX + 96, SW = SX + (NMAX + r - 1) * CW + PX;
let tok = 0;
const still = f => () => { tok++; return f(); };
const slideHTML = (b, i) => {
  const m = blocks[b], n = m.notes.length;
  const lab = (c, cls, t) => `<div class="lab">${chip(c, cls)}<span>${t}</span></div>`;
  return `<div class="sl" data-k="${b}-${i}" style="width:${SW - PX}px">
  <div class="sr" style="top:0">${lab('Q', 'q', '입력')}</div>
  <div class="sr" style="top:0;left:${SX - PX}px">${cells(0, r, c => c < i ? 'dim' : 'tint')}</div>
  <div class="sr" style="top:5px;left:${SX - PX + r * CW + 12}px"><span class="note">${i ? `앞 ${i}칸 뗌` : '전체'}</span></div>
  <div class="sr sl-st" style="top:0;left:${SX - PX + (r + 4) * CW}px"><span class="pill soft">위치 0</span></div>
  <div class="sr" style="top:64px">${lab(m.tag, '', '원곡')}</div>
  <div class="sr sl-m" style="top:64px;left:${SX - PX}px">${cells(0, n, () => '')}</div>
  <div class="sr sl-q" style="top:108px;left:${SX - PX}px">${cells(i, r, () => 'tint')}</div>
  <div class="sr" style="top:166px"><span class="note">맞은 칸</span></div>
  <div class="sr sl-rec" style="top:166px;left:${SX - PX}px">${Array.from({ length: n }, () => '<span></span>').join('')}</div>
</div>`;
};
function runSlide(t, b, i) {
  const el = document.querySelector(`#stage .sl[data-k="${b}-${i}"]`);
  if (!el) return;
  const m = blocks[b], n = m.notes.length, row = K[b][i], calm = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const ms = [...el.querySelectorAll('.sl-m .tl')], qs = [...el.querySelectorAll('.sl-q .tl')], rec = [...el.querySelectorAll('.sl-rec span')];
  const qrow = el.querySelector('.sl-q'), st = el.querySelector('.sl-st .pill');
  let j = 0, best = 0;
  const alive = () => t === tok && el.isConnected && el.parentElement.style.opacity !== '0' && !document.getElementById('fit').hidden;
  const reset = () => { j = 0; best = 0; rec.forEach(x => { x.textContent = ''; x.className = ''; }); };
  const paint = (k, over) => {
    ms.forEach((c, x) => c.className = 'tl' + (x >= j && x < j + k ? ' on' : k < over && x === j + k ? ' miss' : ''));
    qs.forEach((c, x) => c.className = 'tl' + (x < k ? ' on' : k < over && x === k ? ' miss' : x >= over ? ' dim' : ''));
  };
  const step = () => {
    if (!alive()) return;
    if (j === n) { setTimeout(() => { if (alive()) { reset(); step(); } }, 1800); return; }
    const k = row[j], over = Math.min(r - i, n - j);
    qrow.style.transform = `translateX(${j * CW}px)`;
    ms.forEach(c => c.className = 'tl'); qs.forEach((c, x) => c.className = 'tl tint' + (x >= over ? ' dim' : ''));
    st.textContent = `위치 ${j}`; st.className = 'pill soft';
    setTimeout(() => {
      if (!alive()) return;
      paint(k, over);
      best = Math.max(best, k);
      rec[j].textContent = k;
      rec.forEach((x, y) => x.className = y <= j && +x.textContent === best && best > 1 ? 'hit' : '');
      st.textContent = `위치 ${j}: ${k}칸 일치 · 최댓값 ${best}칸`; st.className = 'pill';
      j++;
      setTimeout(step, calm ? 600 : 520);
    }, calm ? 0 : 300);
  };
  reset(); step();
}
const slide = (b, i) => () => {
  const t = ++tok;
  setTimeout(() => runSlide(t, b, i), 80);
  return { W: SW, H: PY + 200, items: [{ id: 'sl', x: PX, y: PY, html: slideHTML(b, i) }] };
};

// 4. 모든 쌍 표: 채우는 순서 = 코드의 for문 순서
const cols = `36px ${blocks.map(m => `repeat(${m.notes.length},24px)`).join(' 8px ')}`;
let mx = `<b class="rl"></b>` + blocks.map((m, g) => `<b class="hd" style="grid-column:span ${m.notes.length}">${chip(m.tag)}</b>` + (g < 2 ? '<b class="sp"></b>' : '')).join('');
const base = blocks.map((_, g) => blocks.slice(0, g).reduce((t, m) => t + m.notes.length * r, 0));
Q.notes.forEach((_, i) => {
  mx += `<b class="rl">Q${i}</b>`;
  blocks.forEach((m, g) => {
    m.notes.forEach((_, j) => {
      const k = K[g][i][j], v = k > 1 ? `color-mix(in srgb,var(--blue) ${20 + 80 * (k - 1) / (L - 1)}%,var(--card))` : 'var(--fill)';
      mx += `<b style="--v:${v};--d:${(base[g] + i * m.notes.length + j) * 14}ms">${k === L ? k : ''}</b>`;
    });
    if (g < 2) mx += '<b class="sp"></b>';
  });
});
const matrix = fill => ({
  W: PX * 2 + 36 + total * 24 + 16 + (total + 2) * 4, H: PY + 60 + (r + 1) * 28 + 10,
  items: [
    { id: 'cnt', x: PX, y: PY, html: `<span class="pill ${fill ? 'blue' : ''}">입력 시작 ${r}곳 × 블록 시작 ${total}곳 = ${r * total}번</span>` },
    { id: 'mx', x: PX, y: PY + 56, html: `<div class="mx" style="grid-template-columns:${cols}">${mx}</div>`, cls: fill ? 'fill' : '' }
  ]
});

// 5. 결과
const result = () => {
  const it = [], y = k => k < 3 ? PY + k * 56 : PY + 3 * 56 + 24;
  blocks.forEach((m, k) => {
    const seg = best.filter(x => x.m === m), on = c => seg.some(x => c >= x.j && c < x.j + L);
    it.push({ id: 'lab-' + m.tag, x: PX, y: y(k), html: labHTML(m) });
    it.push({ id: 'arr-' + m.tag, x: X, y: y(k), html: cells(0, m.notes.length, c => on(c) ? 'on' : 'dim') });
  });
  const qi = new Set(best.map(x => x.i)), qon = c => [...qi].some(i => c >= i && c < i + L);
  it.push({ id: 'lab-Q', x: PX, y: y(3), html: labHTML(Q) });
  it.push({ id: 'arr-Q', x: X, y: y(3), html: cells(0, r, c => qon(c) ? 'on' : 'dim') });
  return { W: X + NMAX * CW + 24, H: y(3) + 52, items: it };
};
const seg = best.map(x => `${x.m.tag} ${x.j}~${x.j + L - 1}번 칸`).join(', ');

startPage({
  W: 700,
  next: { href: 'sorted.html', label: '다음 방식: 정렬 배열' },
  steps: [
    { phase: '구축', label: '그대로 저장', title: '원곡 블록과 입력을 받은 그대로 배열로 저장', desc: ['칸 하나 = 음 하나, 칸 안 숫자 = 배열 번호', '원곡은 블록 단위 배열, 실제 데이터는 곡 하나가 여러 블록 (여기서는 곡마다 블록 하나)', '입력은 최대 32칸이라 블록보다 짧음', '미리 정리하지 않고 검색할 때마다 전부 비교'], frames: [{ draw: still(plain) }] },
    { phase: '검색', label: '한 번 비교', title: '입력 칸을 블록 칸에 맞대고 같은 세로줄끼리 비교', frames: [
      { title: '입력 0번 칸을 블록 0번 칸에 맞추면 1칸에서 중단', desc: ['같은 세로줄끼리 비교, 흐린 칸은 비교하지 않는 칸', '첫 칸 쌍으로 높이 차이와 길이 비율을 정하고, 다음 칸부터 같은 차이·비율인지 확인', '테두리 칸에서 달라져 비교 중단'], draw: still(() => pair(0, 0)) },
      { title: '입력 1번 칸을 블록 2번 칸에 맞추면 4칸 연속 일치', desc: ['입력 앞 칸을 떼고, 블록 중간 칸에서 시작하는 쌍도 비교', '그래서 입력과 원곡의 시작이 달라도 일치 구간을 찾음'], draw: still(() => pair(1, 2)) }
