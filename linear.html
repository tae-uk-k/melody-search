<script type="text/plain" id="src">
// letter(), common_length()는 main.cpp의 공통 함수
// 원곡은 배열 하나(data.all)에 이어 붙여 저장, 곡 끝마다 구분 칸 SEP(0)
// s번에서 시작하는 조각의 k번째 변화 글자
int letter(const Melody& m, int s, int k) {
    if (k == 0) return m.patch[s] == -1 ? START_NOTE : START_REST;  // 시작 칸: 음이면 ●, 쉼이면 ○
    int p = s + k;
    if (p == m.patch[s]) return m.edge_no_pitch[p];  // 쉼으로 시작한 조각의 첫 실제 음
    return m.edge[p];
}

// 두 위치부터 변화 글자가 몇 칸 연속 같은지. 구분 칸에 닿으면 멈춤
int common_length(const Melody& a, int sa, const Melody& b, int sb, int limit) {
    int k = 0;
    while (k < limit) {
        int c = letter(a, sa, k);
        if (c == SEP || c != letter(b, sb, k)) break;
        k++;
    }
    return k;
}

class LinearArray {
public:
    // 순차 배열은 미리 만들 것이 없다. 읽을 때 만든 변화 글자 배열을 그대로 쓴다.
    void build(const Database&) {}

    // 역할: 입력과 같은 모양으로 이어지는 원곡 구간 중 가장 긴 것을 찾는다.
    //       (조옮김·길이 배율이 달라도 같은 모양이면 일치로 본다)
    //       입력과 원곡의 모든 시작 위치 쌍을 하나씩 비교한다.
    //       돌려주는 값: 최대 일치 길이, 그 길이로 일치한 곡명 목록
    Result find(const Database& data, const Melody& query) {
        int r = query.size();
        int best = 0;         // 지금까지 찾은 최대 일치 길이
        set<string> names;    // best 길이로 일치한 곡명

        for (int b = 0; b < data.blocks(); b++) {
            // 이 블록 안에서의 최대 일치 길이를 구한다.
            int block_best = 0;
            for (int i = 0; i < r; i++) {
                // 조기 종료: 입력 i번부터의 일치는 최대 r - i항목이다.
                // 이 블록에서 이미 찾은 길이를 넘을 수 없거나 전체 최댓값에 못 미치면 뒤의 i는 볼 필요가 없다.
                if (r - i <= block_best || r - i < best) break;
                for (int j = data.begin(b); j < data.end(b); j++) {
                    int length = common_length(query, i, data.all, j, r);
                    if (length > block_best) block_best = length;
                    if (block_best == r - i) break;  // 남은 입력 전체가 일치: 이 블록에서 더 긴 일치는 없다
                }
            }

            // 더 긴 일치를 찾으면 이전 곡명 목록을 비운다.
            if (block_best > best) {
                best = block_best;
                names.clear();
            }
            // 최대 길이와 같으면 곡명을 추가한다. set이 같은 곡명을 한 번만 남긴다.
            if (block_best == best && best > 0) names.insert(data.names[b]);
        }
        return make_result(best, names);
    }
};
</script>
<script type="text/plain" id="src-py">
# letter(), common_length()는 main.py의 공통 함수
# 원곡은 배열 하나(data.all)에 이어 붙여 저장, 곡 끝마다 구분 칸 SEP(0)
# s번에서 시작하는 조각의 k번째 변화 글자
def letter(m, s, k):
    if k == 0:  # 시작 칸: 음이면 ●, 쉼이면 ○
        return START_NOTE if m.patch[s] == -1 else START_REST
    p = s + k
    if p == m.patch[s]:  # 쉼으로 시작한 조각의 첫 실제 음
        return m.edge_no_pitch[p]
    return m.edge[p]

# 두 위치부터 변화 글자가 몇 칸 연속 같은지. 구분 칸에 닿으면 멈춤
def common_length(a, sa, b, sb, limit):
    k = 0
    while k < limit:
        c = letter(a, sa, k)
        if c == SEP or c != letter(b, sb, k):
            break
        k += 1
    return k

class LinearArray:

    # 순차 배열은 별도의 색인을 만들지 않음
    # 읽을 때 만든 변화 글자 배열을 그대로 사용
    def build(self, data):
        pass

    # 입력 멜로디와 원곡을 비교하여 가장 긴 일치 구간 찾기
    def find(self, data, query):

        r = query.size()

        best = 0          # 전체 최대 일치 길이
        names = set()     # 최대 길이로 일치한 곡명

        # 원곡의 모든 블록을 하나씩 확인
        for b in range(data.blocks()):

            block_best = 0  # 현재 블록의 최대 일치 길이

            # 입력 멜로디의 모든 시작 위치
            for i in range(r):

                # 조기 종료: 입력 i번부터의 일치는 최대 r - i칸
                # 이 블록에서 찾은 길이를 넘을 수 없거나 전체 최대 길이에 못 미치면 중단
                if r - i <= block_best or r - i < best:
                    break

                # 원곡 멜로디의 모든 시작 위치
                for j in range(data.begin(b), data.end(b)):

                    # 두 위치부터 변화 글자가 연속으로 같은 길이 계산
                    length = common_length(
                        query, i, data.all, j, r
                    )

                    # 현재 블록에서 가장 긴 길이 저장
                    if length > block_best:
                        block_best = length

                    # 남은 입력 전체가 일치하면 이 블록에서 더 긴 일치는 없음
                    if block_best == r - i:
                        break

            # 전체 최대 길이보다 길면 갱신
            if block_best > best:
                best = block_best
                names.clear()

            # 최대 길이가 같으면 곡명 추가
            if block_best == best and best > 0:
                names.add(data.names[b])

        # 최대 일치 길이와 정렬된 곡명 반환
        return best, sorted(names)
</script>
<script src="common.js?v=12"></script>
<script>
{
// 순차 배열 예제: 블록 길이 16, 9, 8칸, 입력 5칸 (입력 첫 칸은 틀린 음)
const mk = (tag, name, arr, q) => ({ tag, name, q, notes: arr.map(([p, d]) => ({ p, d })) });
const blocks = [
  mk('A', '반짝반짝 작은 별', [[60, 2], [60, 2], [67, 2], [67, 2], [69, 2], [69, 2], [67, 4], [65, 2], [65, 2], [64, 2], [64, 2], [62, 2], [62, 2], [60, 4], [67, 2], [67, 2]]),
  mk('B', '떴다 떴다 비행기', [[64, 3], [62, 1], [60, 2], [62, 2], [64, 2], [64, 2], [64, 4], [62, 2], [62, 2]]),
  mk('C', 'ABC 노래', [[65, 2], [65, 2], [72, 2], [72, 2], [74, 2], [74, 2], [72, 4], [70, 2]])
];
const Q = mk('Q', '입력 구절', [[55, 2], [62, 4], [62, 4], [64, 4], [64, 4]], true), r = Q.notes.length;
// 데이터를 읽을 때 칸마다 앞 칸과의 변화(음/쉼 종류, 높이 변화, 길이 비율)를 번호로 바꿔 저장. 같은 변화 = 같은 번호
// 입력은 사전에 새 번호를 넣지 않음: 원곡에 없는 변화는 가장 큰 번호(UNSEEN)
const dict = makeDict();
blocks.forEach(m => makeLetters(m, dict));
makeLetters(Q, dict, false);
// 원곡 블록은 배열 하나에 이어 붙임: base = 배열 안 첫 위치, 블록 끝마다 구분 칸(0) 하나
{ let at = 0; blocks.forEach(m => { m.base = at; at += m.notes.length + 1; }); }
const A = blocks[0], X = PX + LBL, NMAX = Math.max(...blocks.map(m => m.notes.length)), total = blocks.reduce((t, m) => t + m.notes.length, 0);
// 모든 쌍의 일치 길이 (코드와 같은 순서: 블록 → 입력 시작 i → 블록 시작 j)
const K = blocks.map(m => Q.notes.map((_, i) => m.notes.map((_, j) => common(Q, i, m, j))));
const L = Math.max(...K.flat(2));
const best = [];
blocks.forEach((m, b) => K[b].forEach((row, i) => row.forEach((k, j) => { if (k === L) best.push({ m, i, j }); })));
const names = [...new Set(best.map(x => x.m.name))];

// 배열 칸: 칸 안 = 저장된 변화 번호. 비교를 시작하는 칸(s)과 배열 첫 칸은 앞 칸이 없어 시작 표시(● 음, ○ 쉼)
const startMark = (m, c) => m.notes[c].p < 0 ? '<span class="ring"></span>' : '<span class="dot"></span>';
const sym = (m, s, c) => c === s || c === 0 ? startMark(m, c) : symHTML(c > s ? letter(m, s, c - s) : letter(m, 0, c));
// sep: 끝에 구분 칸(0)을 붙임. 구분 칸에 닿으면 비교가 멈춤
const cells = (m, s, from, to, cls, sep) => { let h = ''; for (let c = from; c < to; c++) h += `<span class="tl ${cls(c) || ''}">${sym(m, s, c)}</span>`; return `<div class="row">${h}${sep ? sepHTML() : ''}</div>`; };
const lenTag = m => `<span class="note">${m.notes.length}칸</span>`;

// 1. 구축: 원곡 블록을 배열 하나로 이어 저장 (그림은 블록마다 줄 바꿈). 위 숫자 = 배열 안 위치
const plain = () => {
  const it = [], y = k => k < 3 ? PY + 18 + k * 72 : PY + 18 + 3 * 72 + 16;
  [...blocks, Q].forEach((m, k) => {
    const n = m.notes.length;
    it.push({ id: 'lab-' + m.tag, x: PX, y: y(k), html: labHTML(m) });
    it.push({ id: 'ix-' + m.tag, x: X, y: y(k) - 18, html: idxHTML(m.q ? 0 : m.base, n + 1) });
    it.push({ id: 'arr-' + m.tag, x: X, y: y(k), html: cells(m, 0, 0, n, () => '', true) });
    it.push({ id: 'len-' + m.tag, x: X + (n + 1) * CW + 12, y: y(k) + 5, html: lenTag(m) });
  });
  return { W: X + (NMAX + 1) * CW + 70, H: y(3) + 52, items: it };
};

// 2. 한 쌍 비교: 입력 i번 칸을 블록 j번 칸 아래에 맞대고 같은 세로줄끼리 비교
const pair = (i, j) => {
  const k = K[0][i][j], over = Math.min(r - i, A.notes.length - j), y0 = PY + 28, y1 = y0 + 64;
  const miss = k < over;
  return { W: X + (A.notes.length + 1) * CW + 150, H: y1 + 66, items: [
    { id: 'lab-A', x: PX, y: y0, html: labHTML(A) },
    { id: 'arr-A', x: X, y: y0, html: cells(A, j, 0, A.notes.length, c => c >= j && c < j + k ? 'on' : miss && c === j + k ? 'miss' : c < j || c >= j + over ? 'dim' : '', true) },
    { id: 'jm', x: X + j * CW, y: y0 - 26, w: 32, html: `<span class="cap mk">j=${j}</span>` },
    { id: 'lab-Q', x: PX, y: y1, html: labHTML(Q) },
    { id: 'arr-Q', x: X + (j - i) * CW, y: y1, html: cells(Q, i, 0, r, c => c < i ? 'dim' : c < i + k ? 'on' : miss && c === i + k ? 'miss' : c >= i + over ? 'dim' : '', true) },
    { id: 'im', x: X + j * CW, y: y1 + 38, w: 32, html: `<span class="cap mk">i=${i}</span>` },
    { id: 'pill', x: X + (A.notes.length + 1) * CW + 20, y: y0 + 30, html: `<span class="pill ${k === over ? 'blue' : ''}">${k}칸 일치</span>` }
  ] };
};

// 3. 반복 순서: 입력 한 줄이 원곡 아래에서 한 칸씩 뒤로 이동. 원곡 끝에 닿으면 처음부터 다시
// 위치마다 입력 첫 칸부터 비교 → 맞은 칸 수 기록 → 맞든 틀리든 한 칸 뒤로
const SX = PX + 96, SW = SX + (NMAX + r) * CW + PX;
let tok = 0;
const still = f => () => { tok++; slideOn = false; return f(); };
let slideOn = false;  // 지금 단계가 이동 그림인지
const slideHTML = (b, i) => {
  const m = blocks[b], n = m.notes.length;
  const lab = (c, cls, t) => `<div class="lab">${chip(c, cls)}<span>${t}</span></div>`;
  return `<div class="sl" data-k="${b}-${i}" style="width:${SW - PX}px">
  <div class="sr" style="top:0">${lab('Q', 'q', '입력')}</div>
  <div class="sr" style="top:0;left:${SX - PX}px">${cells(Q, i, 0, r, c => c < i ? 'dim' : 'tint')}</div>
  <div class="sr" style="top:5px;left:${SX - PX + r * CW + 12}px"><span class="note">${i ? `앞 ${i}칸 뗌` : '전체'}</span></div>
  <div class="sr sl-st" style="top:0;left:${SX - PX + (r + 4) * CW}px"><span class="pill soft">위치 ${m.base}</span></div>
  <div class="sr sl-idx" style="top:50px;left:${SX - PX}px">${Array.from({ length: n + 1 }, (_, c) => `<span>${m.base + c}</span>`).join('')}</div>
  <div class="sr" style="top:70px">${lab(m.tag, '', '원곡')}</div>
  <div class="sr sl-m" style="top:70px;left:${SX - PX}px">${cells(m, 0, 0, n, () => '', true)}</div>
  <div class="sr sl-q" style="top:114px;left:${SX - PX}px">${cells(Q, i, i, r, () => 'tint')}</div>
  <div class="sr" style="top:172px"><span class="note">맞은 칸</span></div>
  <div class="sr sl-rec" style="top:172px;left:${SX - PX}px">${Array.from({ length: n }, () => '<span></span>').join('')}</div>
</div>`;
};
let autoOn = true;  // 자동 이동 여부. 단계를 넘어가도 유지
let ctl = null;     // 지금 보이는 이동 그림의 조작 함수 (하단 재생 버튼이 호출)
const PLAY = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4.8v14.4a1 1 0 0 0 1.53.85l11.2-7.2a1 1 0 0 0 0-1.7L8.53 3.95A1 1 0 0 0 7 4.8z"/></svg>';
const PAUSE = '<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="6" y="4.5" width="4" height="15" rx="1.3"/><rect x="14" y="4.5" width="4" height="15" rx="1.3"/></svg>';
function playIcon() {

  b.innerHTML = autoOn ? PAUSE : PLAY;
  b.setAttribute('aria-label', autoOn ? '일시정지' : '재생'); b.title = autoOn ? '일시정지' : '재생';
}
function runSlide(t, b, i) {
  const el = document.querySelector(`#stage .sl[data-k="${b}-${i}"]`);
  if (!el) return;
  const m = blocks[b], n = m.notes.length, row = K[b][i], calm = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const ms = [...el.querySelectorAll('.sl-m .tl:not(.sep)')], qs = [...el.querySelectorAll('.sl-q .tl')], rec = [...el.querySelectorAll('.sl-rec span')];
  const qrow = el.querySelector('.sl-q'), st = el.querySelector('.sl-st .pill');
  const base = ms.map(c => c.innerHTML);
  let j = 0, best = 0, timers = [];   // j = 다음에 비교할 위치. 0~j-1 위치는 비교 끝
  const later = (f, d) => timers.push(setTimeout(f, d));
  const stop = () => { timers.forEach(clearTimeout); timers = []; };
  const alive = () => t === tok && el.isConnected && el.parentElement.style.opacity !== '0' && !document.getElementById('fit').hidden;
  const reset = () => {
    j = 0; best = 0;
    rec.forEach(x => { x.textContent = ''; x.className = ''; });
    qrow.style.transform = 'translateX(0px)';
    ms.forEach((c, x) => { c.className = 'tl'; c.innerHTML = base[x]; });
    qs.forEach(c => c.className = 'tl tint');
    st.textContent = `위치 ${m.base}`; st.className = 'pill soft';
  };
  const paint = (k, over) => {
    ms.forEach((c, x) => c.className = 'tl' + (x >= j && x < j + k ? ' on' : k < over && x === j + k ? ' miss' : ''));
    qs.forEach((c, x) => c.className = 'tl' + (x < k ? ' on' : k < over && x === k ? ' miss' : x >= over ? ' dim' : ''));
  };
  // 위치 j로 옮기고 비교 결과 표시. 끝나면 j가 하나 늘어남
  const step = (then, d = calm ? 0 : 300) => {
    if (!alive()) return;
    if (j === n) reset();
    const k = row[j], over = Math.min(r - i, n - j);
    qrow.style.transform = `translateX(${j * CW}px)`;
    ms.forEach((c, x) => { c.className = 'tl'; c.innerHTML = x === j ? startMark(m, j) : base[x]; }); qs.forEach((c, x) => c.className = 'tl tint' + (x >= over ? ' dim' : ''));
    st.textContent = `위치 ${m.base + j}`; st.className = 'pill soft';
    const show = () => {
      if (!alive()) return;
      paint(k, over);
      best = Math.max(best, k);
      rec[j].textContent = k;
      rec.forEach((x, y) => x.className = y <= j && +x.textContent === best && best > 1 ? 'hit' : '');
      st.textContent = `위치 ${m.base + j}: ${k}칸 일치 · 최댓값 ${best}칸`; st.className = 'pill';
      j++;
      if (then) then();
    };
    if (d) later(show, d); else show();
  };
  // 자동 이동: 한 칸씩 계속, 끝에 닿으면 잠깐 멈춘 뒤 처음부터
  const play = () => {
    if (!alive() || !autoOn) return;
    if (j === n) { later(() => { if (alive() && autoOn) { reset(); play(); } }, 1800); return; }
    step(() => later(play, calm ? 600 : 520));
  };
  const pause = () => { autoOn = false; stop(); playIcon(); };
  ctl = {
    toggle() { autoOn = !autoOn; stop(); playIcon(); if (autoOn) play(); },
    fwd() { pause(); step(null, 0); },
    back() {
      pause();
      if (j <= 1) { reset(); return; }
      // 마지막 기록 하나를 지우고 그 앞 위치를 다시 표시
      rec[j - 1].textContent = ''; rec[j - 1].className = '';
      j -= 2;
      best = Math.max(0, ...rec.slice(0, j).map(x => +x.textContent || 0));
      step(null, 0);
    }
  };
  reset(); playIcon();
  if (autoOn) play();
}
const slide = (b, i) => () => {
  const t = ++tok; slideOn = true;
  setTimeout(() => runSlide(t, b, i), 80);
  return { W: SW, H: PY + 206, items: [{ id: 'sl', x: PX, y: PY, html: slideHTML(b, i) }] };
};

    m.notes.forEach((_, j) => {

      mx += `<b style="--v:${v};--d:${(base[g] + i * m.notes.length + j) * 14}ms">${k === L ? k : ''}</b>`;
    });
    if (g < 2) mx += '<b class="sp"></b>';
  });
});
const matrix = fill => ({
  W: PX * 2 + 36 + total * 24 + 16 + (total + 2) * 4, H: PY + 60 + (r + 1) * 28 + 10,
  items: [
    { id: 'cnt', x: PX, y: PY, html: `<span class="pill ${fill ? 'blue' : ''}">입력 시작 ${r}곳 × 블록 시작 ${total}곳 = ${r * total}번</span>` },
    { id: 'mx', x: PX, y: PY + 56, html: `<div class="mx" style="grid-template-columns:${cols}">${mx}</div>`, cls: fill ? 'fill' : '' }
  ]
});

// 5. 결과
const result = () => {
  const it = [], y = k => k < 3 ? PY + k * 56 : PY + 3 * 56 + 24;
  blocks.forEach((m, k) => {
    const seg = best.filter(x => x.m === m), on = c => seg.some(x => c >= x.j && c < x.j + L);
    it.push({ id: 'lab-' + m.tag, x: PX, y: y(k), html: labHTML(m) });

  });
  const qi = new Set(best.map(x => x.i)), qon = c => [...qi].some(i => c >= i && c < i + L);
  it.push({ id: 'lab-Q', x: PX, y: y(3), html: labHTML(Q) });
  it.push({ id: 'arr-Q', x: X, y: y(3), html: cells(Q, [...qi][0], 0, r, c => qon(c) ? 'on' : 'dim') });
  return { W: X + NMAX * CW + 24, H: y(3) + 52, items: it };
};
const seg = best.map(x => `${x.m.tag} 블록 위치 ${x.m.base + x.j}~${x.m.base + x.j + L - 1}`).join(', ');
